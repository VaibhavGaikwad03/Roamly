# Netlify configuration for Roamly.
[build]
  command = "npm run build"
  publish = "dist"

# AI is bring-your-own-key by default: each visitor enters their own Groq key
# in the app (stored in their browser), so there is no central key to manage.
#
# To instead run a shared, server-side key for everyone, uncomment the line
# below and set GROQ_API_KEY in the Netlify dashboard — the included function
# (netlify/functions/ai.mjs) then proxies AI calls. A user's own key, if set,
# always takes priority over the shared one.
# [build.environment]
#   VITE_AI_PROXY_URL = "/api/ai"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# AI proxy: map the app's /api/ai to the serverless function. Must come before
# the SPA fallback below (redirects are evaluated top-to-bottom, first match
# wins) so the API call isn't swallowed by the catch-all.
[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/ai"
  status = 200

# Single-page app: serve index.html for any other unknown path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
